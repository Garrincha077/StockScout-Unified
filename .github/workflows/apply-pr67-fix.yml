name: Apply PR67 narrow alert retry fix

on:
  push:
    branches:
      - fix/persist-alert-evaluation-for-retry
    paths:
      - .github/workflows/apply-pr67-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/persist-alert-evaluation-for-retry

      - name: Apply reviewed retry snapshot patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          OPEN = '$' + '{{'
          CLOSE = '}}'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) Persist the exact owner-alert evaluation in the source EOD run.
          path = '.github/workflows/eod.yml'
          text = read(path)
          deliver = '      - name: Deliver five resumable Telegram series\n'
          if deliver not in text:
              raise SystemExit('EOD delivery anchor missing')
          if 'name: unified-alerts-' not in text:
              condition = f"{OPEN} (github.event_name == 'schedule' || inputs.notify) && vars.UNIFIED_DELIVERY_ENDPOINT != '' {CLOSE}"
              artifact_name = f"unified-alerts-{OPEN} github.run_id {CLOSE}-{OPEN} github.run_attempt {CLOSE}"
              block = (
                  '      - name: Preserve exact owner alert evaluation for notification retry\n'
                  f'        if: {condition}\n'
                  '        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1\n'
                  '        with:\n'
                  f'          name: {artifact_name}\n'
                  '          path: .notify/alerts.json\n'
                  '          include-hidden-files: true\n'
                  '          if-no-files-found: error\n'
                  '          retention-days: 14\n'
              )
              text = text.replace(deliver, block + deliver, 1)
              write(path, text)

          # 2) Retry downloads and validates that exact source-run snapshot.
          path = '.github/workflows/notification-retry.yml'
          text = read(path)
          extract = '      - name: Extract and bind notification inputs to the exact deployed run\n'
          if extract not in text:
              raise SystemExit('Retry extraction anchor missing')
          if 'name: Download the exact owner alert evaluation from the same EOD run' not in text:
              source = f"{OPEN} steps.request.outputs.source_run_id {CLOSE}"
              token = f"{OPEN} github.token {CLOSE}"
              repo = f"{OPEN} github.repository {CLOSE}"
              block = (
                  '      - name: Download the exact owner alert evaluation from the same EOD run\n'
                  '        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1\n'
                  '        with:\n'
                  f'          pattern: unified-alerts-{source}-*\n'
                  '          path: .alerts-handoff\n'
                  f'          github-token: {token}\n'
                  f'          repository: {repo}\n'
                  f'          run-id: {source}\n\n'
              )
              text = text.replace(extract, block + extract, 1)

          notify_line = '          notify_file="$(find .notify-handoff -maxdepth 2 -type f -name bottom.json | sort -V | tail -n 1)"\n'
          if 'alerts_file="$(find .alerts-handoff' not in text:
              text = text.replace(
                  notify_line,
                  notify_line + '          alerts_file="$(find .alerts-handoff -maxdepth 2 -type f -name alerts.json | sort -V | tail -n 1)"\n',
                  1,
              )

          missing_bottom = '''          if [ -z "$notify_file" ]; then
            echo "::error::No private Bottom digest input exists for source run $SOURCE_RUN_ID"
            exit 1
          fi
'''
          missing_alerts = '''          if [ -z "$alerts_file" ]; then
            echo "::error::No persisted owner alert evaluation exists for source run $SOURCE_RUN_ID"
            exit 1
          fi
'''
          if 'No persisted owner alert evaluation exists' not in text:
              if missing_bottom not in text:
                  raise SystemExit('Bottom fail-closed anchor missing')
              text = text.replace(missing_bottom, missing_bottom + missing_alerts, 1)

          cp_bottom = '          cp "$notify_file" .notify/bottom.json\n'
          if 'cp "$alerts_file" .notify/alerts.json' not in text:
              text = text.replace(cp_bottom, cp_bottom + '          cp "$alerts_file" .notify/alerts.json\n', 1)

          bottom_load = "          bottom = json.loads(Path('.notify/bottom.json').read_text(encoding='utf-8'))\n"
          if "alerts = json.loads(Path('.notify/alerts.json')" not in text:
              text = text.replace(bottom_load, bottom_load + "          alerts = json.loads(Path('.notify/alerts.json').read_text(encoding='utf-8'))\n", 1)

          bottom_validation = '''          if bottom.get('runId') != run_id or bottom.get('sessionDate') != expected_session:
              raise SystemExit('Private Bottom digest input does not match the downloaded Pages run')
'''
          alert_validation = '''          if alerts.get('runId') != run_id or not isinstance(alerts.get('events'), list):
              raise SystemExit('Persisted owner alert evaluation does not match the downloaded Pages run')
'''
          if "alerts.get('runId') != run_id" not in text:
              if bottom_validation not in text:
                  raise SystemExit('Bottom identity validation anchor missing')
              text = text.replace(bottom_validation, bottom_validation + alert_validation, 1)

          lines = text.splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if line.strip() == '- name: Evaluate owner alerts against the exact live run'), None)
          if start is not None:
              end = start + 1
              while end < len(lines) and not (lines[end].startswith('      - name: ') and end > start):
                  end += 1
              del lines[start:end]
              text = ''.join(lines)
          write(path, text)

          # 3) Align the older retry regression contract with immutable snapshot reuse.
          path = 'tests/test_notification_retry_workflow.py'
          text = read(path)
          old = "    assert 'stockscout_unified.cli evaluate-alerts' in workflow\n"
          if old in text:
              source = f"{OPEN} steps.request.outputs.source_run_id {CLOSE}"
              new = (
                  f"    assert 'pattern: unified-alerts-{source}-*' in workflow\n"
                  '    assert "alerts.get(\'runId\') != run_id" in workflow\n'
                  "    assert 'stockscout_unified.cli evaluate-alerts' not in workflow\n"
                  "    assert '--alerts .notify/alerts.json' in workflow\n"
              )
              text = text.replace(old, new, 1)
              write(path, text)

          # 4) Record the reliability change.
          path = 'docs/PROJECT_LOG.md'
          text = read(path)
          marker = '## 2026-09-02 — Immutable owner-alert retry snapshot'
          if marker not in text:
              section = '''
## 2026-09-02 — Immutable owner-alert retry snapshot

- Persist the exact `.notify/alerts.json` produced by the source EOD run before Telegram delivery as a private 14-day artifact.
- Notification-only retry downloads that source-run snapshot, verifies its `runId` against the exact healthy deployed Pages run, and fails closed on missing or mismatched input.
- Retry no longer re-evaluates stateful owner alerts; it only resumes Telegram delivery from the original evaluated events.
- No scanner, ranking, scoring, signal methodology, market-data semantics, Pages activation, or alert-evaluation logic changed.
- Regression contracts require exact snapshot reuse and prohibit retry-time `evaluate-alerts`.

'''
              title = '# StockScout Unified project log\n'
              if title not in text:
                  raise SystemExit('Project log title missing')
              text = text.replace(title, title + section, 1)
              write(path, text)
          PY

          git rm .github/workflows/apply-pr67-fix.yml
          git diff --check

      - name: Commit narrow fix to PR 67
        shell: bash
        run: |
          git config user.name "StockScout Review Supervisor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist alert snapshots for notification retries"
          git push origin HEAD:fix/persist-alert-evaluation-for-retry
