name: Required CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Unified
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            engines/next/requirements.lock

      - name: Install Python test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install -e .

      - name: Verify Python, source pins and workflow contracts
        run: |
          python scripts/verify_source_pins.py
          python -m ruff check src tests scripts
          python -m pytest -q
          python engines/next/verify_legacy_baseline.py

      - name: Verify hash-locked Next environment resolves
        run: python -m pip install --dry-run --require-hashes -r engines/next/requirements.lock

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/mcp/package-lock.json

      - name: Test and build frontend and MCP
        run: |
          npm ci --prefix frontend
          npm run check --prefix frontend
          npm ci --prefix services/mcp
          npm test --prefix services/mcp

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: Test owner Edge function
        run: deno test supabase/functions/unified-operations/index_test.ts

      - name: Test owner RLS policies against local Supabase
        run: |
          npx --yes supabase@2.116.0 start --exclude studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
          npx --yes supabase@2.116.0 test db

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run fixture browser tests
        run: npm run test:e2e --prefix frontend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
