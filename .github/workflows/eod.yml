name: StockScout Unified EOD

on:
  push:
    branches: [main]
    paths:
      - ".github/rollout-trigger"
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      scan_date:
        description: "Completed NYSE session (YYYY-MM-DD); blank uses today"
        required: false
        type: string
      notify:
        description: "Send Telegram only after verified Pages activation"
        required: false
        type: boolean
        default: false
      force_full_refresh:
        description: "Refresh Next fundamentals instead of using the warm cache"
        required: false
        type: boolean
        default: false
      reuse_existing:
        description: "Publish the hash-pinned existing session without running scans"
        required: false
        type: boolean
        default: false

concurrency:
  group: stockscout-unified-eod
  cancel-in-progress: false

jobs:
  reuse-existing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_existing }}
    uses: ./.github/workflows/publish-existing.yml
    with:
      session_date: ${{ inputs.scan_date }}
      notify: ${{ inputs.notify }}
    permissions:
      contents: read
      pages: write
      id-token: write

  scan-build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.reuse_existing }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      session_date: ${{ steps.guard.outputs.session_date }}
      run_id: ${{ steps.identity.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            engines/next/requirements.lock

      - name: Install pinned Python runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install --require-hashes -r engines/next/requirements.lock
          python -m pip install -e .

      - name: Fail closed on partial or missing production owner configuration
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          UNIFIED_DELIVERY_ENDPOINT: ${{ vars.UNIFIED_DELIVERY_ENDPOINT }}
          REQUIRE_OWNER: ${{ github.event_name == 'schedule' || inputs.notify }}
        run: |
          args=()
          if [ "$REQUIRE_OWNER" = "true" ]; then args+=(--require); fi
          python scripts/check_owner_config.py "${args[@]}"

      - name: Select one completed NYSE session
        id: guard
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.scan_date }}
        run: |
          args=(guard --active-manifest https://garrincha077.github.io/StockScout-Unified/data/manifest.json --github-output "$GITHUB_OUTPUT")
          if [ -n "$REQUESTED_DATE" ]; then args+=(--requested-date "$REQUESTED_DATE"); fi
          python -m stockscout_eod.cli "${args[@]}"

      - name: Create immutable run identity
        if: steps.guard.outputs.should_run == 'true'
        id: identity
        shell: bash
        run: echo "run_id=${{ steps.guard.outputs.session_date }}-eod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Verify pinned source contracts
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python scripts/verify_source_pins.py
          python -m ruff check src tests scripts
          python -m pytest -q
          cd engines/next
          python verify_legacy_baseline.py

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          path: |
            data/cache
            engines/next/data/fundamentals_cache
            engines/next/data/git_storage
          key: unified-market-${{ runner.os }}-${{ steps.guard.outputs.session_date }}-${{ hashFiles('requirements.lock', 'engines/next/requirements.lock') }}
          restore-keys: |
            unified-market-${{ runner.os }}-

      - name: Restore only compact previous history
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/restore_compact_history.py

      - name: Run Bottom Fishing (split-only, notifications disabled)
        if: steps.guard.outputs.should_run == 'true'
        env:
          STOCK_SCOUT_NO_NOTIFY: "1"
        run: |
          mkdir -p .staging
          python -m stockscout_eod.cli scan --config config/eod.yaml --output .staging/bottom.json --session-date "${{ steps.guard.outputs.session_date }}" --run-id "${{ steps.identity.outputs.run_id }}" --no-notify
          python -m stockscout_eod.cli health --input .staging/bottom.json
          python -m stockscout_eod.cli charts --input .staging/bottom.json --config config/eod.yaml --output .staging/bottom-charts --storage-base-url "https://garrincha077.github.io/StockScout-Unified/data/modes/bottom-fishing/runs/${{ steps.identity.outputs.run_id }}/charts"
          python -m stockscout_unified.cli publish-bottom --raw-scan .staging/bottom.json --public-dir frontend/public --previous-manifest frontend/public/data/modes/bottom-fishing/manifest.json --chart-manifest ".staging/bottom-charts/${{ steps.identity.outputs.run_id }}/manifest.json" --chart-staging-dir .staging/bottom-charts

      - name: Preserve resumable Bottom checkpoint before Next
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-bottom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .staging/bottom.json
            .staging/bottom-charts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      - name: Run Next and exact Ryan Original capture (adjusted OHLCV)
        if: steps.guard.outputs.should_run == 'true'
        working-directory: engines/next
        env:
          FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh || 'false' }}
          STOCKSCOUT_EXPECTED_SESSION: ${{ steps.guard.outputs.session_date }}
        run: |
          mkdir -p data/daily_scans data/logs data/batch_results frontend/public/data
          python run_fast_scan.py --conservative --git-storage
          python validate_scan_session.py
          python hydrate_rich_fundamentals.py
          python export_frontend_data_fast.py
          python enhance_frontend_dataset.py
          python calibrate_frontend_setups.py
          python compute_group_leadership.py
          python enrich_original_engine.py
          python complete_legacy_capture.py
          python enrich_scan_layers.py
          python apply_fundamental_evidence.py
          python compute_opportunity_v2.py
          python compute_daily_changes.py data/batch_results/previous_frontend.json frontend/public/data/latest.json
          python finalize_opportunity_v2.py
          python validate_canonical_dataset.py
          python audit_group_leadership.py
          python audit_pipeline_models.py
          python audit_fundamental_evidence.py
          python verify_legacy_baseline.py
          python validate_frontend_charts.py frontend/public --strict --minimum-coverage 0.95

      - name: Build verified read-only Next contexts
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/build_next_contexts.py --output-dir .staging/next-context

      - name: Publish isolated Next and Ryan mode assets
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m stockscout_unified.cli publish-adjusted --mode next --canonical engines/next/frontend/public/data/latest.json --chart-dir engines/next/frontend/public/data/charts --public-dir frontend/public --run-id "${{ steps.identity.outputs.run_id }}" --session-date "${{ steps.guard.outputs.session_date }}" --factor-regime .staging/next-context/factor-regime.json --gmli-context .staging/next-context/gmli-context.json
          python -m stockscout_unified.cli publish-adjusted --mode ryan-original --canonical engines/next/frontend/public/data/latest.json --chart-dir engines/next/frontend/public/data/charts --public-dir frontend/public --run-id "${{ steps.identity.outputs.run_id }}" --session-date "${{ steps.guard.outputs.session_date }}"
          python -m stockscout_unified.cli activate --public-dir frontend/public --run-id "${{ steps.identity.outputs.run_id }}" --session-date "${{ steps.guard.outputs.session_date }}"
          python -m stockscout_unified.cli verify --public-dir frontend/public
          python -m stockscout_unified.cli notify --public-dir frontend/public --bottom-raw-scan .staging/bottom.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.should_run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/mcp/package-lock.json

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.guard.outputs.should_run == 'true'
        with:
          deno-version: v2.9.5

      - name: Test OIDC owner operations
        if: steps.guard.outputs.should_run == 'true'
        run: deno test supabase/functions/unified-operations/index_test.ts

      - name: Test and build PWA and MCP
        if: steps.guard.outputs.should_run == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          npm ci --prefix services/mcp
          npm test --prefix services/mcp

      - name: Upload private Telegram render input
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-notify-${{ github.run_id }}-${{ github.run_attempt }}
          path: .staging/bottom.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact only after all three modes pass
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist
          retention-days: 14

      - name: Upload failure diagnostics without runtime market data
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .staging/*.json
            engines/next/data/daily_scans/latest_optimized_scan.txt
            engines/next/data/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  deploy-pages:
    needs: scan-build
    if: needs.scan-build.outputs.should_run == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      run_id: ${{ needs.scan-build.outputs.run_id }}
    permissions:
      contents: read
      pages: write
      id-token: write

  verify-notify:
    needs: [scan-build, deploy-pages]
    if: needs.scan-build.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Download verified scan artifact for Telegram
        if: ${{ github.event_name == 'schedule' || inputs.notify }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: .pages
      - name: Download private Bottom digest input
        if: ${{ github.event_name == 'schedule' || inputs.notify }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unified-notify-${{ github.run_id }}-${{ github.run_attempt }}
          path: .notify
      - name: Extract verified Pages snapshot
        if: ${{ github.event_name == 'schedule' || inputs.notify }}
        run: tar -xf .pages/artifact.tar -C .pages
      - name: Evaluate owner alerts for the exact deployed run
        if: ${{ (github.event_name == 'schedule' || inputs.notify) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        run: python -m stockscout_unified.cli evaluate-alerts --public-dir .pages --endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}" --output .notify/alerts.json
      - name: Deliver five resumable Telegram series
        if: ${{ (github.event_name == 'schedule' || inputs.notify) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m stockscout_unified.cli notify --public-dir .pages --bottom-raw-scan .notify/bottom.json --alerts .notify/alerts.json --delivery-endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}" --allow-notify
      - name: Explain disabled notification infrastructure
        if: ${{ (github.event_name == 'schedule' || inputs.notify) && vars.UNIFIED_DELIVERY_ENDPOINT == '' }}
        run: echo "Telegram was not sent because UNIFIED_DELIVERY_ENDPOINT is not configured." >> "$GITHUB_STEP_SUMMARY"
