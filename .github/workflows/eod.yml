name: StockScout Unified EOD

on:
  push:
    branches: [main]
    paths:
      - ".github/rollout-trigger"
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      scan_date:
        description: "Completed NYSE session (YYYY-MM-DD); blank uses today"
        required: false
        type: string
      notify:
        description: "Send Telegram only after verified Pages activation"
        required: false
        type: boolean
        default: false
      force_full_refresh:
        description: "Refresh Next fundamentals instead of using the warm cache"
        required: false
        type: boolean
        default: false
      reuse_existing:
        description: "Publish the hash-pinned existing session without running scans"
        required: false
        type: boolean
        default: false

concurrency:
  group: stockscout-unified-eod
  cancel-in-progress: false

jobs:
  reuse-existing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_existing }}
    uses: ./.github/workflows/publish-existing.yml
    with:
      session_date: ${{ inputs.scan_date }}
      run_id: ""
      notify: ${{ inputs.notify }}
    permissions:
      contents: read
      pages: write
      id-token: write

  prepare:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.reuse_existing }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      session_date: ${{ steps.guard.outputs.session_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            engines/next/requirements.lock

      - name: Install pinned validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install --require-hashes -r engines/next/requirements.lock
          python -m pip install -e .

      - name: Fail closed on partial or missing production owner configuration
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          UNIFIED_DELIVERY_ENDPOINT: ${{ vars.UNIFIED_DELIVERY_ENDPOINT }}
          REQUIRE_OWNER: ${{ github.event_name == 'schedule' || inputs.notify }}
        run: |
          args=()
          if [ "$REQUIRE_OWNER" = "true" ]; then args+=(--require); fi
          python scripts/check_owner_config.py "${args[@]}"

      - name: Select one completed NYSE session
        id: guard
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.scan_date }}
        run: |
          args=(guard --active-manifest https://garrincha077.github.io/StockScout-Unified/data/manifest.json --github-output "$GITHUB_OUTPUT")
          if [ -n "$REQUESTED_DATE" ]; then args+=(--requested-date "$REQUESTED_DATE"); fi
          python -m stockscout_eod.cli "${args[@]}"

      - name: Verify pinned source contracts
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python scripts/verify_source_pins.py
          python -m ruff check src tests scripts
          python -m pytest -q
          cd engines/next
          python verify_legacy_baseline.py

  bottom:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Bottom runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache
          key: unified-bottom-market-${{ runner.os }}-${{ needs.prepare.outputs.session_date }}-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            unified-bottom-market-${{ runner.os }}-

      - name: Start Bottom scanner timing
        run: echo "BOTTOM_SCAN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Restore same-session Bottom checkpoint
        id: bottom_checkpoint
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .staging/bottom-checkpoint
          key: unified-bottom-v1-${{ runner.os }}-${{ needs.prepare.outputs.session_date }}-${{ hashFiles('config/eod.yaml', 'src/stockscout_eod/**/*.py', 'requirements.lock') }}

      - name: Create Bottom scanner identity
        id: identity
        shell: bash
        run: echo "run_id=${{ needs.prepare.outputs.session_date }}-bottom-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Run Bottom Fishing scan and charts on cache miss
        if: steps.bottom_checkpoint.outputs.cache-hit != 'true'
        env:
          STOCK_SCOUT_NO_NOTIFY: "1"
        run: |
          mkdir -p .staging
          python -m stockscout_eod.cli scan --config config/eod.yaml --output .staging/bottom.json --session-date "${{ needs.prepare.outputs.session_date }}" --run-id "${{ steps.identity.outputs.run_id }}" --no-notify
          python -m stockscout_eod.cli health --input .staging/bottom.json
          python -m stockscout_eod.cli charts --input .staging/bottom.json --config config/eod.yaml --output .staging/bottom-charts --storage-base-url "https://garrincha077.github.io/StockScout-Unified/data/modes/bottom-fishing/runs/${{ steps.identity.outputs.run_id }}/charts"

      - name: Rebind cached Bottom checkpoint to scanner run
        if: steps.bottom_checkpoint.outputs.cache-hit == 'true'
        run: |
          python -m stockscout_unified.cli rebind-bottom-checkpoint \
            --checkpoint-dir .staging/bottom-checkpoint \
            --output-dir .staging \
            --run-id "${{ steps.identity.outputs.run_id }}" \
            --session-date "${{ needs.prepare.outputs.session_date }}" \
            --storage-base-url "https://garrincha077.github.io/StockScout-Unified/data/modes/bottom-fishing/runs/${{ steps.identity.outputs.run_id }}/charts"

      - name: Validate Bottom handoff
        run: python -m stockscout_eod.cli health --input .staging/bottom.json

      - name: Stage fresh Bottom checkpoint for reuse
        if: steps.bottom_checkpoint.outputs.cache-hit != 'true'
        run: |
          rm -rf .staging/bottom-checkpoint
          mkdir -p .staging/bottom-checkpoint
          cp .staging/bottom.json .staging/bottom-checkpoint/bottom.json
          cp -a .staging/bottom-charts .staging/bottom-checkpoint/bottom-charts

      - name: Save reusable Bottom checkpoint before Next
        if: steps.bottom_checkpoint.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .staging/bottom-checkpoint
          key: unified-bottom-v1-${{ runner.os }}-${{ needs.prepare.outputs.session_date }}-${{ hashFiles('config/eod.yaml', 'src/stockscout_eod/**/*.py', 'requirements.lock') }}

      - name: Summarize Bottom scanner
        if: ${{ always() }}
        shell: bash
        run: |
          python -m stockscout_unified.observability bottom \
            --input .staging/bottom.json \
            --output .staging/bottom-scan-summary.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --started-at "${BOTTOM_SCAN_STARTED_AT:-0}"

      - name: Preserve Bottom scanner handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-bottom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .staging/bottom.json
            .staging/bottom-charts/
            .staging/bottom-scan-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  next:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            engines/next/requirements.lock

      - name: Install Next runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --require-hashes -r engines/next/requirements.lock
          python -m pip install -e .

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            engines/next/data/fundamentals_cache
            engines/next/data/git_storage
          key: unified-next-market-${{ runner.os }}-${{ needs.prepare.outputs.session_date }}-${{ hashFiles('engines/next/requirements.lock') }}
          restore-keys: |
            unified-next-market-${{ runner.os }}-

      - name: Start Next scanner timing
        run: echo "NEXT_SCAN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download prior-attempt Next resume checkpoints
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unified-next-progress-${{ github.run_id }}-*
          path: .next-progress-handoff

      - name: Restore latest Next resume checkpoint
        if: github.run_attempt > 1
        shell: bash
        run: |
          checkpoint="$(find .next-progress-handoff -type f -name batch_progress.pkl 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$checkpoint" ]; then
            mkdir -p engines/next/data/batch_results
            cp "$checkpoint" engines/next/data/batch_results/batch_progress.pkl
            echo "Restored prior-attempt Next progress checkpoint: $checkpoint" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No prior-attempt Next progress checkpoint was available; scanner will start clean." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Next scanner (adjusted OHLCV)
        working-directory: engines/next
        env:
          FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh || 'false' }}
          STOCKSCOUT_EXPECTED_SESSION: ${{ needs.prepare.outputs.session_date }}
          STOCKSCOUT_PROGRESS_SOURCE_HASH: ${{ hashFiles('engines/next/run_resumable_fast_scan.py', 'engines/next/run_fast_scan.py', 'engines/next/run_optimized_scan.py', 'engines/next/src/**/*.py', 'engines/next/requirements.lock') }}
        run: |
          mkdir -p data/daily_scans data/logs data/batch_results frontend/public/data
          python run_resumable_fast_scan.py --conservative --git-storage --resume
          python validate_scan_session.py

      - name: Preserve Next resume checkpoint after every scanner attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-next-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: engines/next/data/batch_results/batch_progress.pkl
          if-no-files-found: warn
          retention-days: 2

      - name: Enrich Next and exact Ryan Original capture
        working-directory: engines/next
        env:
          FORCE_FULL_REFRESH: ${{ inputs.force_full_refresh || 'false' }}
          STOCKSCOUT_EXPECTED_SESSION: ${{ needs.prepare.outputs.session_date }}
        run: |
          python hydrate_rich_fundamentals.py
          python export_frontend_data_fast.py
          python enhance_frontend_dataset.py
          python calibrate_frontend_setups.py
          python compute_group_leadership.py
          python enrich_original_engine.py
          python complete_legacy_capture.py
          python enrich_scan_layers.py
          python apply_fundamental_evidence.py
          python compute_opportunity_v2.py
          python compute_daily_changes.py data/batch_results/previous_frontend.json frontend/public/data/latest.json
          python finalize_opportunity_v2.py

      - name: Validate Next dataset before handoff
        working-directory: engines/next
        env:
          STOCKSCOUT_EXPECTED_SESSION: ${{ needs.prepare.outputs.session_date }}
        run: |
          python validate_canonical_dataset.py
          python validate_scan_session.py
          python audit_group_leadership.py
          python audit_pipeline_models.py
          python audit_fundamental_evidence.py
          python verify_legacy_baseline.py
          python validate_frontend_charts.py frontend/public --strict --minimum-coverage 0.95

      - name: Build verified read-only Next contexts
        run: python scripts/build_next_contexts.py --output-dir .staging/next-context

      - name: Stage validated Next handoff
        run: |
          rm -rf .staging/next-checkpoint
          mkdir -p .staging/next-checkpoint
          cp engines/next/frontend/public/data/latest.json .staging/next-checkpoint/latest.json
          cp engines/next/frontend/public/data/manifest.json .staging/next-checkpoint/manifest.json
          cp engines/next/data/daily_scans/latest_optimized_scan.txt .staging/next-checkpoint/latest_optimized_scan.txt
          cp -a engines/next/frontend/public/data/charts .staging/next-checkpoint/charts
          cp -a .staging/next-context .staging/next-checkpoint/next-context

      - name: Preserve Next scanner handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-next-${{ github.run_id }}-${{ github.run_attempt }}
          path: .staging/next-checkpoint/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      - name: Summarize Next scanner
        if: ${{ always() }}
        shell: bash
        run: |
          python -m stockscout_unified.observability next \
            --input engines/next/data/logs/next_scan_metrics.json \
            --output engines/next/data/logs/next-job-summary.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --started-at "${NEXT_SCAN_STARTED_AT:-0}"

      - name: Preserve Next diagnostics after every attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-next-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            engines/next/data/daily_scans/latest_optimized_scan.txt
            engines/next/data/logs/
            engines/next/frontend/public/data/latest.json
          if-no-files-found: warn
          retention-days: 7

  assemble:
    needs: [prepare, bottom, next]
    if: ${{ needs.prepare.outputs.should_run == 'true' && needs.bottom.result == 'success' && needs.next.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install assembly runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Create immutable assembly run identity
        id: identity
        shell: bash
        run: echo "run_id=${{ needs.prepare.outputs.session_date }}-eod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore only compact previous history
        run: python scripts/restore_compact_history.py

      - name: Download Bottom scanner handoffs across attempts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unified-bottom-${{ github.run_id }}-*
          path: .handoff/bottom

      - name: Download Next scanner handoffs across attempts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unified-next-${{ github.run_id }}-*
          path: .handoff/next

      - name: Select latest successful scanner handoffs
        id: handoff
        shell: bash
        run: |
          bottom_file="$(find .handoff/bottom -maxdepth 2 -type f -name bottom.json | sort -V | tail -n 1)"
          next_manifest="$(find .handoff/next -maxdepth 2 -type f -name manifest.json | sort -V | tail -n 1)"
          if [ -z "$bottom_file" ]; then
            echo "::error::No Bottom handoff containing bottom.json was downloaded"
            exit 1
          fi
          if [ -z "$next_manifest" ]; then
            echo "::error::No Next handoff containing manifest.json was downloaded"
            exit 1
          fi
          bottom_dir="$(dirname "$bottom_file")"
          next_dir="$(dirname "$next_manifest")"
          test -f "$next_dir/latest.json"
          test -d "$next_dir/charts"
          test -d "$next_dir/next-context"
          echo "bottom_dir=$bottom_dir" >> "$GITHUB_OUTPUT"
          echo "next_dir=$next_dir" >> "$GITHUB_OUTPUT"

      - name: Rebind and validate Bottom handoff for assembly
        env:
          BOTTOM_DIR: ${{ steps.handoff.outputs.bottom_dir }}
        run: |
          python -m stockscout_unified.cli rebind-bottom-checkpoint \
            --checkpoint-dir "$BOTTOM_DIR" \
            --output-dir .staging \
            --run-id "${{ steps.identity.outputs.run_id }}" \
            --session-date "${{ needs.prepare.outputs.session_date }}" \
            --storage-base-url "https://garrincha077.github.io/StockScout-Unified/data/modes/bottom-fishing/runs/${{ steps.identity.outputs.run_id }}/charts"
          python -m stockscout_eod.cli health --input .staging/bottom.json

      - name: Materialize and verify Next handoff
        env:
          NEXT_DIR: ${{ steps.handoff.outputs.next_dir }}
          SESSION_DATE: ${{ needs.prepare.outputs.session_date }}
        run: |
          mkdir -p engines/next/frontend/public/data .staging
          cp "$NEXT_DIR/latest.json" engines/next/frontend/public/data/latest.json
          cp "$NEXT_DIR/manifest.json" engines/next/frontend/public/data/manifest.json
          rm -rf engines/next/frontend/public/data/charts .staging/next-context
          cp -a "$NEXT_DIR/charts" engines/next/frontend/public/data/charts
          cp -a "$NEXT_DIR/next-context" .staging/next-context
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("engines/next/frontend/public/data/manifest.json").read_text())
          expected = os.environ["SESSION_DATE"]
          session = manifest.get("marketSession") or {}
          if session.get("date") != expected or session.get("status") != "closed":
              raise SystemExit(f"Next handoff session mismatch: {session}")
          PY
          python scripts/verify_next_chart_snapshot.py \
            --canonical engines/next/frontend/public/data/latest.json \
            --manifest engines/next/frontend/public/data/manifest.json \
            --chart-dir engines/next/frontend/public/data/charts

      - name: Publish and activate all three isolated modes
        run: |
          python -m stockscout_unified.cli publish-bottom --raw-scan .staging/bottom.json --public-dir frontend/public --previous-manifest frontend/public/data/modes/bottom-fishing/manifest.json --chart-manifest ".staging/bottom-charts/${{ steps.identity.outputs.run_id }}/manifest.json" --chart-staging-dir .staging/bottom-charts
          python -m stockscout_unified.cli publish-adjusted --mode next --canonical engines/next/frontend/public/data/latest.json --chart-dir engines/next/frontend/public/data/charts --public-dir frontend/public --run-id "${{ steps.identity.outputs.run_id }}" --session-date "${{ needs.prepare.outputs.session_date }}" --factor-regime .staging/next-context/factor-regime.json --gmli-context .staging/next-context/gmli-context.json
          python -m stockscout_unified.cli publish-adjusted --mode ryan-original --canonical engines/next/frontend/public/data/latest.json --chart-dir engines/next/frontend/public/data/charts --public-dir frontend/public --run-id "${{ steps.identity.outputs.run_id }}" --session-date "${{ needs.prepare.outputs.session_date }}"
          python -m stockscout_unified.cli activate --public-dir frontend/public --run-id "${{ steps.identity.outputs.run_id }}" --session-date "${{ needs.prepare.outputs.session_date }}"
          python -m stockscout_unified.cli verify --public-dir frontend/public
          python -m stockscout_unified.cli notify --public-dir frontend/public --bottom-raw-scan .staging/bottom.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/mcp/package-lock.json

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: Test OIDC owner operations
        run: deno test supabase/functions/unified-operations/index_test.ts

      - name: Test and build PWA and MCP
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          npm ci --prefix services/mcp
          npm test --prefix services/mcp

      - name: Upload private Telegram render input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-notify-${{ github.run_id }}-${{ github.run_attempt }}
          path: .staging/bottom.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact only after all three modes pass
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist
          retention-days: 14

      - name: Upload assembly failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-assembly-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .staging/*.json
            .handoff/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  deploy-pages:
    needs: assemble
    if: needs.assemble.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      run_id: ${{ needs.assemble.outputs.run_id }}
    permissions:
      contents: read
      pages: write
      id-token: write

  verify-notify:
    needs: [assemble, deploy-pages]
    if: needs.assemble.result == 'success' && needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Download verified scan artifact for Telegram
        if: ${{ github.event_name == 'schedule' || inputs.notify }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: .pages
      - name: Download private Bottom digest inputs across attempts
        if: ${{ github.event_name == 'schedule' || inputs.notify }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unified-notify-${{ github.run_id }}-*
          path: .notify-handoff
      - name: Extract verified Pages snapshot and latest Bottom digest input
        if: ${{ github.event_name == 'schedule' || inputs.notify }}
        shell: bash
        run: |
          tar -xf .pages/artifact.tar -C .pages
          notify_file="$(find .notify-handoff -maxdepth 2 -type f -name bottom.json | sort -V | tail -n 1)"
          if [ -z "$notify_file" ]; then
            echo "::error::No private Bottom digest input was downloaded"
            exit 1
          fi
          mkdir -p .notify
          cp "$notify_file" .notify/bottom.json
      - name: Evaluate owner alerts for the exact deployed run
        if: ${{ (github.event_name == 'schedule' || inputs.notify) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        run: python -m stockscout_unified.cli evaluate-alerts --public-dir .pages --endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}" --output .notify/alerts.json
      - name: Preserve exact owner alert evaluation for notification retry
        if: ${{ (github.event_name == 'schedule' || inputs.notify) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-alerts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .notify/alerts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Deliver five resumable Telegram series
        if: ${{ (github.event_name == 'schedule' || inputs.notify) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m stockscout_unified.cli notify --public-dir .pages --bottom-raw-scan .notify/bottom.json --alerts .notify/alerts.json --delivery-endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}" --allow-notify
      - name: Explain disabled notification infrastructure
        if: ${{ (github.event_name == 'schedule' || inputs.notify) && vars.UNIFIED_DELIVERY_ENDPOINT == '' }}
        run: echo "Telegram was not sent because UNIFIED_DELIVERY_ENDPOINT is not configured." >> "$GITHUB_STEP_SUMMARY"