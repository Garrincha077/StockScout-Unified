name: Manual EOD Backfill Launcher

on:
  push:
    branches: [main]
    paths:
      - ".github/manual-eod-trigger"

permissions:
  actions: write
  contents: read

concurrency:
  group: stockscout-unified-manual-eod-launcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read requested completed session
        id: request
        shell: bash
        run: |
          scan_date="$(sed -n 's/^scan_date:[[:space:]]*//p' .github/manual-eod-trigger | tail -n 1 | tr -d '\r')"
          notify="$(sed -n 's/^notify:[[:space:]]*//p' .github/manual-eod-trigger | tail -n 1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$scan_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid or missing scan_date in .github/manual-eod-trigger" >&2
            exit 1
          fi
          if [[ -z "$notify" ]]; then
            notify=false
          fi
          if [[ "$notify" != "true" && "$notify" != "false" ]]; then
            echo "notify must be true or false in .github/manual-eod-trigger" >&2
            exit 1
          fi
          echo "scan_date=$scan_date" >> "$GITHUB_OUTPUT"
          echo "notify=$notify" >> "$GITHUB_OUTPUT"

      - name: Dispatch full EOD workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_DATE: ${{ steps.request.outputs.scan_date }}
          NOTIFY: ${{ steps.request.outputs.notify }}
        run: |
          gh workflow run eod.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f scan_date="$SCAN_DATE" \
            -f notify="$NOTIFY" \
            -f force_full_refresh=false \
            -f reuse_existing=false
          echo "Dispatched full EOD workflow for $SCAN_DATE (notify=$NOTIFY)" >> "$GITHUB_STEP_SUMMARY"
