name: StockScout Morning Recovery

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated recovery targets: eod,gridview"
        required: true
        default: "eod,gridview"
        type: string
      session_date:
        description: "Completed NYSE session to recover (YYYY-MM-DD); required for eod"
        required: false
        default: ""
        type: string
      notify:
        description: "Send after verified recovery; manual default is disabled"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/recovery/stockscout-morning.trigger"

permissions:
  actions: write
  contents: read

concurrency:
  group: stockscout-morning-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve requested recovery targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            targets="${{ inputs.targets }}"
            session_date="${{ inputs.session_date }}"
            notify="${{ inputs.notify }}"
          else
            targets="$(sed -n 's/^targets=//p' .github/recovery/stockscout-morning.trigger | tail -n 1)"
            session_date="$(sed -n 's/^session_date=//p' .github/recovery/stockscout-morning.trigger | tail -n 1)"
            # Preserve the existing morning watchdog's delivery policy; explicit
            # notify=false makes push-triggered validation read-only.
            notify="$(sed -n 's/^notify=//p' .github/recovery/stockscout-morning.trigger | tail -n 1)"
            notify="${notify:-true}"
          fi
          targets="${targets// /}"
          session_date="${session_date// /}"
          if [ -z "$targets" ]; then targets="none"; fi
          if [[ "$notify" != "true" && "$notify" != "false" ]]; then
            echo "::error::notify must be true or false"
            exit 1
          fi
          if [[ "$targets" == *"eod"* || "$targets" == *"gridview"* ]] && [[ ! "$session_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::EOD/GridView recovery requires session_date=YYYY-MM-DD"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "session_date=$session_date" >> "$GITHUB_OUTPUT"
          echo "notify=$notify" >> "$GITHUB_OUTPUT"
          {
            echo "## StockScout Morning Recovery"
            echo
            echo "- Trigger: `${{ github.event_name }}`"
            echo "- Targets: `$targets`"
            echo "- Session: `${session_date:-n/a}`"
            echo
            echo "| Target | Run | Result | Public output |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch requested workflows and wait for completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.targets.outputs.targets }}
          SESSION_DATE: ${{ steps.targets.outputs.session_date }}
          NOTIFY: ${{ steps.targets.outputs.notify }}
          TREND_BIRTH_REFRESH_TOKEN: ${{ secrets.TREND_BIRTH_REFRESH_TOKEN }}
        run: |
          set -uo pipefail
          failed=0

          selected() {
            case ",$TARGETS," in
              *",$1,"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          row() {
            printf '| %s | %s | %s | %s |\n' "$1" "$2" "$3" "$4" >> "$GITHUB_STEP_SUMMARY"
          }

          dispatch_and_wait() {
            key="$1"
            workflow="$2"
            label="$3"
            max_polls="$4"
            shift 4

            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            args=(--method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" -f ref=main)
            while [ "$#" -gt 0 ]; do
              args+=(-f "$1")
              shift
            done

            if ! gh api "${args[@]}" >/dev/null; then
              row "$label" "-" "DISPATCH FAILED" "-"
              failed=1
              return
            fi

            run_id=""
            for _ in $(seq 1 30); do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=20")"
              run_id="$(printf '%s' "$payload" | jq -r --arg t "$started" '[.workflow_runs[] | select(.created_at >= $t)] | sort_by(.created_at) | .[0].id // empty')"
              [ -n "$run_id" ] && break
              sleep 4
            done

            if [ -z "$run_id" ]; then
              row "$label" "-" "RUN NOT FOUND" "-"
              failed=1
              return
            fi

            run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
            conclusion=""
            for _ in $(seq 1 "$max_polls"); do
              state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              status="$(printf '%s' "$state" | jq -r '.status')"
              conclusion="$(printf '%s' "$state" | jq -r '.conclusion // ""')"
              [ "$status" = "completed" ] && break
              sleep 15
            done

            if [ "$conclusion" != "success" ]; then
              row "$label" "[run]($run_url)" "${conclusion:-TIMEOUT}" "-"
              failed=1
              return
            fi

            public="n/a"
            result="SUCCESS"
            if [ "$key" = "eod" ]; then
              public="pending verification"
              for _ in $(seq 1 40); do
                if curl -fsS "https://garrincha077.github.io/StockScout-Unified/data/manifest.json" -o /tmp/stockscout-manifest.json; then
                  live_session="$(jq -r '.marketSession.date // .sessionDate // .date // empty' /tmp/stockscout-manifest.json)"
                  live_status="$(jq -r '.status // empty' /tmp/stockscout-manifest.json)"
                  if [ "$live_session" = "$SESSION_DATE" ] && [ "$live_status" = "healthy" ]; then
                    live_run="$(jq -r '.runId // empty' /tmp/stockscout-manifest.json)"
                    if python scripts/verify_remote_activation.py --run-id "$live_run" --session-date "$SESSION_DATE"; then
                      public="manifest verified for $SESSION_DATE ($live_run)"
                      break
                    fi
                  fi
                fi
                sleep 6
              done
              if [[ "$public" != "manifest verified for $SESSION_DATE ("* ]]; then
                failed=1
                result="ACTIVATION VERIFICATION FAILED"
              fi
            fi

            row "$label" "[run]($run_url)" "$result" "$public"
          }

          request_gridview_refresh() {
            # GITHUB_TOKEN is scoped to this repository. Without a dedicated
            # token, the Trend Birth monitor detects activation every 15 minutes.
            if ! curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
              "https://garrincha077.github.io/StockScout-Unified/data/manifest.json?recovery=$(date +%s)" -o /tmp/unified-refresh-source.json; then
              return 1
            fi
            source_run="$(jq -r '.runId // empty' /tmp/unified-refresh-source.json)"
            if ! python scripts/verify_remote_activation.py --run-id "$source_run" --session-date "$SESSION_DATE"; then
              return 1
            fi
            if [ -z "$TREND_BIRTH_REFRESH_TOKEN" ]; then
              echo "Trend Birth's activation monitor will pick up the verified session; waiting for exact publication." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            GH_TOKEN="$TREND_BIRTH_REFRESH_TOKEN" gh api --method POST \
              repos/Garrincha077/StockScout-Trend-Birth/actions/workflows/refresh-trend-birth-review-lab.yml/dispatches \
              -f ref=main -f "inputs[session_date]=$SESSION_DATE" -f "inputs[source_run_id]=$source_run" >/dev/null
          }

          wait_for_gridview_ready() {
            deployed_url="https://stockscout-trend-birth-review-lab.vercel.app/data/publication.json"
            committed_url="https://raw.githubusercontent.com/Garrincha077/StockScout-Trend-Birth/feature/unified-review-grid-lab/lab/data/publication.json"
            unified_url="https://garrincha077.github.io/StockScout-Unified/data/manifest.json"

            deadline="$(($(date +%s) + 2700))"
            while [ "$(date +%s)" -lt "$deadline" ]; do
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$deployed_url?recovery=$(date +%s)" -o /tmp/grid-deployed.json \
                && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$committed_url?recovery=$(date +%s)" -o /tmp/grid-committed.json \
                && curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$unified_url?recovery=$(date +%s)" -o /tmp/unified-live.json; then
                deployed_session="$(jq -r '.sessionDate // empty' /tmp/grid-deployed.json)"
                committed_session="$(jq -r '.sessionDate // empty' /tmp/grid-committed.json)"
                unified_session="$(jq -r '.sessionDate // .marketSession.date // empty' /tmp/unified-live.json)"
                deployed_run="$(jq -r '.runId // empty' /tmp/grid-deployed.json)"
                committed_run="$(jq -r '.runId // empty' /tmp/grid-committed.json)"
                unified_run="$(jq -r '.runId // empty' /tmp/unified-live.json)"
                unified_status="$(jq -r '.status // empty' /tmp/unified-live.json)"

                if jq -e --slurp '.[0] == .[1]' /tmp/grid-deployed.json /tmp/grid-committed.json >/dev/null \
                  && [ "$deployed_session" = "$SESSION_DATE" ] \
                  && [ "$committed_session" = "$SESSION_DATE" ] \
                  && [ "$unified_session" = "$SESSION_DATE" ] \
                  && [ "$deployed_run" = "$committed_run" ] \
                  && [ "$deployed_run" = "$unified_run" ] \
                  && [ "$unified_status" = "healthy" ]; then
                  echo "GridView deployment is ready for $SESSION_DATE ($deployed_run)." >> "$GITHUB_STEP_SUMMARY"
                  return 0
                fi
              fi
              sleep 10
            done

            echo "::error::GridView deployment did not converge to Unified session $SESSION_DATE within the recovery window"
            {
              echo
              echo "### GridView readiness timeout"
              echo
              echo "- Expected session: `$SESSION_DATE`"
              echo "- Deployed: `${deployed_session:-unknown}` / `${deployed_run:-unknown}`"
              echo "- Committed: `${committed_session:-unknown}` / `${committed_run:-unknown}`"
              echo "- Unified: `${unified_session:-unknown}` / `${unified_run:-unknown}`"
            } >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          # EOD must finish and publish first so Trend Birth reads the newest deployed session.
          if selected eod; then
            dispatch_and_wait eod eod.yml "Unified EOD" 720 "inputs[scan_date]=$SESSION_DATE" "inputs[notify]=$NOTIFY"
          fi

          if selected gridview; then
            if [ "$failed" -eq 0 ] && request_gridview_refresh && wait_for_gridview_ready; then
              dispatch_and_wait gridview trend-birth-gridview-telegram.yml "Trend Birth GridView" 80 "inputs[deliver]=$NOTIFY"
            else
              row "Trend Birth GridView" "-" "READINESS TIMEOUT" "not dispatched"
              failed=1
            fi
          fi

          if [ "$TARGETS" = "none" ]; then
            row "No recovery requested" "-" "NOOP" "-"
          fi

          exit "$failed"
