name: Notification-only Telegram Retry

on:
  push:
    branches: [main]
    paths:
      - ".github/notify-retry-trigger"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "EOD workflow run that produced the deployed verified artifacts"
        required: true
        type: string
      session_date:
        description: "Expected deployed NYSE session (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: stockscout-unified-notification-retry
  cancel-in-progress: false

jobs:
  retry-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install notification runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Read and validate retry request
        id: request
        shell: bash
        env:
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DISPATCH_SESSION_DATE: ${{ inputs.session_date }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            source_run_id="$DISPATCH_SOURCE_RUN_ID"
            session_date="$DISPATCH_SESSION_DATE"
          else
            source_run_id="$(sed -n 's/^source_run_id:[[:space:]]*//p' .github/notify-retry-trigger | tail -n 1 | tr -d '\r')"
            session_date="$(sed -n 's/^session_date:[[:space:]]*//p' .github/notify-retry-trigger | tail -n 1 | tr -d '\r')"
          fi
          if [[ ! "$source_run_id" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must be numeric" >&2
            exit 1
          fi
          if [[ ! "$session_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "session_date must be YYYY-MM-DD" >&2
            exit 1
          fi
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "session_date=$session_date" >> "$GITHUB_OUTPUT"

      - name: Fail closed on missing owner notification configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          UNIFIED_DELIVERY_ENDPOINT: ${{ vars.UNIFIED_DELIVERY_ENDPOINT }}
        run: python scripts/check_owner_config.py --require

      - name: Download the exact verified Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: .pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}

      - name: Download the private Bottom digest input from the same EOD run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unified-notify-${{ steps.request.outputs.source_run_id }}-*
          path: .notify-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}

      - name: Extract and bind notification inputs to the exact deployed run
        id: identity
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          SESSION_DATE: ${{ steps.request.outputs.session_date }}
        run: |
          test -f .pages/artifact.tar
          tar -xf .pages/artifact.tar -C .pages
          notify_file="$(find .notify-handoff -maxdepth 2 -type f -name bottom.json | sort -V | tail -n 1)"
          if [ -z "$notify_file" ]; then
            echo "::error::No private Bottom digest input exists for source run $SOURCE_RUN_ID"
            exit 1
          fi
          mkdir -p .notify
          cp "$notify_file" .notify/bottom.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('.pages/data/manifest.json').read_text(encoding='utf-8'))
          bottom = json.loads(Path('.notify/bottom.json').read_text(encoding='utf-8'))
          expected_session = os.environ['SESSION_DATE']
          source_run_id = os.environ['SOURCE_RUN_ID']
          run_id = str(manifest.get('runId') or '').strip()
          if manifest.get('status') != 'healthy':
              raise SystemExit('Downloaded Pages artifact is not healthy')
          if manifest.get('sessionDate') != expected_session:
              raise SystemExit(f"Pages session mismatch: {manifest.get('sessionDate')} != {expected_session}")
          if f'-eod-{source_run_id}-' not in run_id:
              raise SystemExit(f'Pages run {run_id} is not owned by source workflow run {source_run_id}')
          if bottom.get('runId') != run_id or bottom.get('sessionDate') != expected_session:
              raise SystemExit('Private Bottom digest input does not match the downloaded Pages run')
          print(f'run_id={run_id}')
          PY

      - name: Verify every local mode hash before notification
        run: python -m stockscout_unified.cli verify --public-dir .pages

      - name: Verify this exact artifact is still the live Pages activation
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: python scripts/verify_remote_activation.py --run-id "$RUN_ID"

      - name: Evaluate owner alerts against the exact live run
        run: python -m stockscout_unified.cli evaluate-alerts --public-dir .pages --endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}" --output .notify/alerts.json

      - name: Resume and deliver Telegram series only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m stockscout_unified.cli notify --public-dir .pages --bottom-raw-scan .notify/bottom.json --alerts .notify/alerts.json --delivery-endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}" --allow-notify

      - name: Record successful notification-only retry
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          SESSION_DATE: ${{ steps.request.outputs.session_date }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
        run: |
          {
            echo "## Notification-only retry succeeded"
            echo ""
            echo "Session: \`$SESSION_DATE\`"
            echo "Deployed run: \`$RUN_ID\`"
            echo "Source EOD workflow run: \`$SOURCE_RUN_ID\`"
            echo "Scan invoked: **false**"
            echo "Pages deployment invoked: **false**"
          } >> "$GITHUB_STEP_SUMMARY"
