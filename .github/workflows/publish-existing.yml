name: Publish Existing Verified Scan

on:
  workflow_call:
    inputs:
      session_date:
        description: "Verified existing session to publish"
        required: true
        type: string
      notify:
        description: "Render the private Telegram dry run after publication"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      session_date:
        description: "Verified existing session to publish"
        required: true
        type: choice
        options:
          - "2026-08-25"
        default: "2026-08-25"
      notify:
        description: "Render the private Telegram dry run after publication"
        required: false
        type: boolean
        default: false

jobs:
  build-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
    steps:
      - name: Check out Unified application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read immutable reuse identity
        id: identity
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          session = os.environ["SESSION_DATE"]
          source = json.loads(Path(f"config/reuse_snapshots/{session}.json").read_text())
          if source["sessionDate"] != session:
              raise SystemExit("reuse session identity mismatch")
          print(f"run_id={source['runId']}")
          print(f"release_tag={source['releaseTag']}")
          print(f"asset_name={source['assetName']}")
          print(f"asset_sha256={source['assetSha256']}")
          print(f"raw_sha256={source['rawScanSha256']}")
          print(f"charts_sha256={source['chartManifestSha256']}")
          print(f"next_source_commit={source['nextSourceCommit']}")
          print(f"next_snapshot_commit={source['nextSnapshotCommit']}")
          print(f"next_canonical_sha256={source['nextCanonicalSha256']}")
          pages = source["nextPagesArtifact"]
          if pages["repository"] != "Garrincha077/StockScreener-next":
              raise SystemExit("reuse Next Pages artifact repository is not allowlisted")
          print(f"next_pages_repository={pages['repository']}")
          print(f"next_pages_workflow_run_id={pages['workflowRunId']}")
          print(f"next_pages_artifact_id={pages['artifactId']}")
          print(f"next_pages_artifact_name={pages['name']}")
          release_asset = source["nextPagesReleaseAsset"]
          if release_asset["releaseTag"] != source["releaseTag"]:
              raise SystemExit("Next Pages release asset is not tied to the reuse release")
          print(f"next_pages_release_tag={release_asset['releaseTag']}")
          print(f"next_pages_asset_name={release_asset['name']}")
          print(f"next_pages_asset_sha256={release_asset['sha256']}")
          print(f"next_pages_asset_bytes={release_asset['bytes']}")
          PY

      - name: Check out exact existing Next and Ryan result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Garrincha077/StockScreener-next
          ref: ${{ steps.identity.outputs.next_snapshot_commit }}
          path: .sources/next
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            frontend/public/data/latest.json
            frontend/public/data/manifest.json
            frontend/public/data/charts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install and verify application code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install -e .
          python scripts/verify_source_pins.py
          python -m ruff check src tests scripts
          python -m pytest -q

      - name: Download the hash-pinned Bottom checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          ASSET_NAME: ${{ steps.identity.outputs.asset_name }}
          ASSET_SHA256: ${{ steps.identity.outputs.asset_sha256 }}
        run: |
          mkdir -p .staging/reuse
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir .staging/reuse
          echo "$ASSET_SHA256  .staging/reuse/$ASSET_NAME" | sha256sum --check --strict
          tar -xzf ".staging/reuse/$ASSET_NAME" -C .staging/reuse

      - name: Verify reused scan and chart identities
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          NEXT_SOURCE_COMMIT: ${{ steps.identity.outputs.next_source_commit }}
          RAW_SHA256: ${{ steps.identity.outputs.raw_sha256 }}
          CHARTS_SHA256: ${{ steps.identity.outputs.charts_sha256 }}
          NEXT_CANONICAL_SHA256: ${{ steps.identity.outputs.next_canonical_sha256 }}
        run: |
          echo "$RAW_SHA256  .staging/reuse/bottom.json" | sha256sum --check --strict
          echo "$CHARTS_SHA256  .staging/reuse/bottom-charts/$RUN_ID/manifest.json" | sha256sum --check --strict
          echo "$NEXT_CANONICAL_SHA256  .sources/next/frontend/public/data/latest.json" | sha256sum --check --strict
          python -m stockscout_eod.cli health --input .staging/reuse/bottom.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = json.loads(Path(".staging/reuse/bottom.json").read_text())
          charts = json.loads(
              Path(f".staging/reuse/bottom-charts/{os.environ['RUN_ID']}/manifest.json").read_text()
          )
          next_manifest = json.loads(
              Path(".sources/next/frontend/public/data/manifest.json").read_text()
          )
          for payload in (raw, charts):
              if payload["runId"] != os.environ["RUN_ID"]:
                  raise SystemExit("reused run identity mismatch")
              if payload["sessionDate"] != os.environ["SESSION_DATE"]:
                  raise SystemExit("reused session identity mismatch")
              if payload["priceMode"] != "split_only":
                  raise SystemExit("Bottom reuse price basis is not split_only")
          if charts["coveragePct"] != 100.0:
              raise SystemExit("Bottom reuse charts are incomplete")
          if next_manifest["marketSession"] != {
              "date": os.environ["SESSION_DATE"],
              "status": "closed",
              "timezone": "America/New_York",
          }:
              raise SystemExit("Next snapshot is not the requested closed session")
          if next_manifest["provenance"]["source"]["sourceCommit"] != os.environ["NEXT_SOURCE_COMMIT"]:
              raise SystemExit("Next engine source commit mismatch")
          if next_manifest["provenance"]["source"]["sha256"] != os.environ["NEXT_CANONICAL_SHA256"]:
              raise SystemExit("Next canonical manifest hash mismatch")
          PY

      - name: Download and verify the immutable Next Pages chart snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PAGES_WORKFLOW_RUN_ID: ${{ steps.identity.outputs.next_pages_workflow_run_id }}
          NEXT_PAGES_RELEASE_TAG: ${{ steps.identity.outputs.next_pages_release_tag }}
          NEXT_PAGES_ASSET_NAME: ${{ steps.identity.outputs.next_pages_asset_name }}
          NEXT_PAGES_ASSET_SHA256: ${{ steps.identity.outputs.next_pages_asset_sha256 }}
          NEXT_PAGES_ASSET_BYTES: ${{ steps.identity.outputs.next_pages_asset_bytes }}
        run: |
          archive=".staging/reuse/next-pages-artifact.zip"
          archive_dir=".staging/reuse/next-pages-archive"
          pages_dir=".staging/reuse/next-pages"
          chart_dir=".sources/next/frontend/public/data/charts"
          mkdir -p "$archive_dir" "$pages_dir" "$chart_dir"
          gh release download "$NEXT_PAGES_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$NEXT_PAGES_ASSET_NAME" \
            --dir .staging/reuse
          mv ".staging/reuse/$NEXT_PAGES_ASSET_NAME" "$archive"
          echo "$NEXT_PAGES_ASSET_SHA256  $archive" | sha256sum --check --strict
          test "$(stat -c '%s' "$archive")" = "$NEXT_PAGES_ASSET_BYTES"
          unzip -q "$archive" -d "$archive_dir"
          if [ -f "$archive_dir/artifact.tar" ]; then
            tar -xf "$archive_dir/artifact.tar" -C "$pages_dir"
          else
            cp -a "$archive_dir/." "$pages_dir/"
          fi
          pages_manifest="$(find "$pages_dir" -type f -path '*/data/manifest.json' -print -quit)"
          if [ -z "$pages_manifest" ]; then
            echo "Next Pages artifact has no data/manifest.json" >&2
            exit 1
          fi
          pages_data="${pages_manifest%/manifest.json}"
          cmp --silent "$pages_manifest" .sources/next/frontend/public/data/manifest.json || {
            echo "Next Pages artifact manifest differs from the pinned Next snapshot" >&2
            exit 1
          }
          export NEXT_PAGES_WORKFLOW_RUN_ID
          python - "$pages_manifest" <<'PY'
          import json
          import os
          import sys

          manifest = json.loads(open(sys.argv[1], encoding="utf-8").read())
          actual = str(((manifest.get("provenance") or {}).get("source") or {}).get("workflowRunId") or "")
          if actual != os.environ["NEXT_PAGES_WORKFLOW_RUN_ID"]:
              raise SystemExit("Next Pages artifact workflow run mismatch")
          PY
          cp -a "$pages_data/charts/." "$chart_dir/"
          mkdir -p "$chart_dir"
          python scripts/verify_next_chart_snapshot.py \
            --canonical .sources/next/frontend/public/data/latest.json \
            --manifest .sources/next/frontend/public/data/manifest.json \
            --chart-dir "$chart_dir"

      - name: Publish all three isolated modes without scanning
        shell: bash
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          NEXT_SOURCE_COMMIT: ${{ steps.identity.outputs.next_source_commit }}
        run: |
          python -m stockscout_unified.cli publish-bottom \
            --raw-scan .staging/reuse/bottom.json \
            --public-dir frontend/public \
            --chart-manifest ".staging/reuse/bottom-charts/$RUN_ID/manifest.json" \
            --chart-staging-dir .staging/reuse/bottom-charts
          python scripts/build_next_contexts.py --output-dir .staging/next-context
          python -m stockscout_unified.cli publish-adjusted \
            --mode next \
            --canonical .sources/next/frontend/public/data/latest.json \
            --chart-dir .sources/next/frontend/public/data/charts \
            --public-dir frontend/public \
            --run-id "$RUN_ID" \
            --session-date "$SESSION_DATE" \
            --source-commit "$NEXT_SOURCE_COMMIT" \
            --factor-regime .staging/next-context/factor-regime.json \
            --gmli-context .staging/next-context/gmli-context.json
          python -m stockscout_unified.cli publish-adjusted \
            --mode ryan-original \
            --canonical .sources/next/frontend/public/data/latest.json \
            --chart-dir .sources/next/frontend/public/data/charts \
            --public-dir frontend/public \
            --run-id "$RUN_ID" \
            --session-date "$SESSION_DATE"
          python -m stockscout_unified.cli activate \
            --public-dir frontend/public \
            --run-id "$RUN_ID" \
            --session-date "$SESSION_DATE"
          python -m stockscout_unified.cli verify --public-dir frontend/public

      - name: Render Telegram dry run only when requested
        if: inputs.notify
        run: |
          python -m stockscout_unified.cli notify \
            --public-dir frontend/public \
            --bottom-raw-scan .staging/reuse/bottom.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/mcp/package-lock.json

      - name: Test and build PWA and MCP
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          npm ci --prefix services/mcp
          npm test --prefix services/mcp

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist
          retention-days: 14

  deploy-pages:
    needs: build-existing
    uses: ./.github/workflows/deploy-pages.yml
    with:
      run_id: ${{ needs.build-existing.outputs.run_id }}
    permissions:
      contents: read
      pages: write
      id-token: write
