name: Trend Birth GridView Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/stockscout_unified/gridview_notification.py"
      - "tests/test_gridview_notification.py"
      - ".github/workflows/trend-birth-gridview-telegram.yml"
  schedule:
    # Runs ten minutes after the isolated LAB refresh probes.
    - cron: "27 3 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "27 7 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "27 11 * * 2-6"
      timezone: "Europe/Zagreb"
    - cron: "27 17 * * 2-6"
      timezone: "Europe/Zagreb"

concurrency:
  group: trend-birth-gridview-telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install notification runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Test GridView notification contract
        run: python -m unittest tests/test_gridview_notification.py -v

      - name: Deliver GridView summary once per session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m stockscout_unified.gridview_notification \
            --marker-path ".state/trend-birth-gridview-last-sent.txt" \
            --min-session-date "2026-09-18"

      - name: Persist delivery marker after successful send
        run: |
          if [ -z "$(git status --porcelain -- .state/trend-birth-gridview-last-sent.txt)" ]; then
            echo "Delivery marker unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/trend-birth-gridview-last-sent.txt
          git commit -m "chore: mark GridView Telegram delivery"
          git push origin HEAD:main
