name: Trend Birth Hourly Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trend-birth-hourly-bootstrap.yml"

concurrency:
  group: trend-birth-hourly-bootstrap
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install watcher runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Restore hourly stage state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/trend-birth-hourly.json
          key: trend-birth-hourly-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trend-birth-hourly-${{ runner.os }}-

      - name: Bootstrap hourly baseline now
        run: python -m stockscout_unified.trend_birth_hourly --update-state

      - name: Save hourly stage state
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/trend-birth-hourly.json
          key: trend-birth-hourly-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
