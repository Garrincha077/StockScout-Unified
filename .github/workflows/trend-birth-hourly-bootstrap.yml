name: Trend Birth Hourly Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trend-birth-hourly-bootstrap.yml"

concurrency:
  group: trend-birth-hourly-bootstrap
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install watcher runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Restore hourly stage state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/trend-birth-hourly.json
          key: trend-birth-hourly-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trend-birth-hourly-${{ runner.os }}-

      - name: Bootstrap baseline from verified EOD snapshot
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from stockscout_unified.trend_birth_hourly import (
              RULESET,
              fetch_verified_universe,
              save_state,
          )

          manifest, candidates = fetch_verified_universe()
          tickers = {}
          counts = Counter()
          for item in candidates:
              ticker = str(item.get("ticker") or "").upper()
              radar = item.get("trendBirth") or {}
              if not ticker or radar.get("available") is not True:
                  continue
              stage = int(radar.get("stage") or 0)
              counts[stage] += 1
              tickers[ticker] = {
                  "rawStage": stage,
                  "effectiveStage": stage,
                  "barDate": str(radar.get("barDate") or manifest["sessionDate"]),
                  "belowCount": 0,
                  "lastBelowBar": None,
              }

          state = {
              "schemaVersion": 1,
              "ruleset": RULESET,
              "initialized": True,
              "tickers": tickers,
          }
          save_state(Path(".state/trend-birth-hourly.json"), state)
          print({
              "sessionDate": manifest["sessionDate"],
              "baselineTickers": len(tickers),
              "stageCounts": dict(sorted(counts.items())),
              "telegramSent": False,
          })
          PY

      - name: Save hourly stage state
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/trend-birth-hourly.json
          key: trend-birth-hourly-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
