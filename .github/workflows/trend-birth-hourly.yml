name: Trend Birth Hourly Watch

on:
  workflow_dispatch:
    inputs:
      deliver:
        description: "Send stage-change alerts (default is dry-run)"
        type: boolean
        default: false
  schedule:
    # Check once per hour on US trading weekdays; alerts remain stage-change only.
    - cron: "17 * * * 1-5"
      timezone: "Europe/Zagreb"

concurrency:
  group: trend-birth-hourly-watch
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install watcher runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Test hourly Trend Birth contract
        run: python -m pytest -q tests/test_trend_birth_hourly.py tests/test_trend_birth_alert_notification.py

      - name: Restore hourly stage state
        id: stage_state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/trend-birth-hourly.json
          key: trend-birth-hourly-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trend-birth-hourly-${{ runner.os }}-

      - name: Dry-run hourly watcher
        if: github.event_name == 'workflow_dispatch' && !inputs.deliver
        run: python -m stockscout_unified.trend_birth_hourly

      - name: Run hourly watcher and deliver sparse alerts
        if: ${{ (github.event_name == 'schedule' || inputs.deliver) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m stockscout_unified.trend_birth_hourly \
            --update-state \
            --send \
            --delivery-endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}"

      - name: Save hourly stage state
        if: ${{ success() && (github.event_name == 'schedule' || inputs.deliver) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/trend-birth-hourly.json
          key: trend-birth-hourly-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Explain disabled delivery
        if: ${{ (github.event_name == 'schedule' || inputs.deliver) && vars.UNIFIED_DELIVERY_ENDPOINT == '' }}
        run: echo "Hourly Trend Birth alerts are paused because UNIFIED_DELIVERY_ENDPOINT is not configured."
