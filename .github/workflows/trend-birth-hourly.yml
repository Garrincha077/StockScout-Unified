name: Trend Birth Hourly Watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trend-birth-hourly.yml"
      - "src/stockscout_unified/trend_birth_hourly.py"
      - "tests/test_trend_birth_hourly.py"
      - "tests/test_trend_birth_hourly_workflow.py"
  workflow_dispatch:
    inputs:
      deliver:
        description: "Send stage-change alerts (default is dry-run)"
        type: boolean
        default: false
  schedule:
    # Once per hour during the potential NYSE regular-session window.
    # A calendar gate below skips holidays and early-close periods.
    - cron: "47 9-15 * * 1-5"
      timezone: "America/New_York"

concurrency:
  group: trend-birth-hourly-watch
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install watcher runtime
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install -e .

      - name: Test hourly Trend Birth contract
        run: python -m pytest -q tests/test_trend_birth_hourly.py tests/test_trend_birth_alert_notification.py tests/test_trend_birth_hourly_workflow.py

      - name: Check NYSE regular session
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          import pandas_market_calendars as mcal

          now = datetime.now(timezone.utc)
          nyse = mcal.get_calendar("NYSE")
          sched = nyse.schedule(start_date=now.date(), end_date=now.date())

          is_open = False
          market_open = None
          market_close = None
          if not sched.empty:
              market_open = sched.iloc[0]["market_open"].to_pydatetime()
              market_close = sched.iloc[0]["market_close"].to_pydatetime()
              is_open = market_open <= now < market_close

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"open={'true' if is_open else 'false'}\n")
              if market_open is not None:
                  fh.write(f"market_open={market_open.isoformat()}\n")
                  fh.write(f"market_close={market_close.isoformat()}\n")

          print({
              "now_utc": now.isoformat(),
              "market_open": market_open.isoformat() if market_open else None,
              "market_close": market_close.isoformat() if market_close else None,
              "open": is_open,
          })
          PY

      - name: Restore hourly stage state
        if: ${{ github.event_name == 'workflow_dispatch' || steps.market.outputs.open == 'true' }}
        id: stage_state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/trend-birth-hourly.json
          key: trend-birth-hourly-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trend-birth-hourly-v2-${{ runner.os }}-

      - name: Bootstrap hourly baseline on watcher change
        if: ${{ github.event_name == 'push' && steps.market.outputs.open == 'true' && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        run: |
          python -m stockscout_unified.trend_birth_hourly \
            --update-state \
            --delivery-endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}"

      - name: Dry-run hourly watcher
        if: github.event_name == 'workflow_dispatch' && !inputs.deliver
        run: python -m stockscout_unified.trend_birth_hourly

      - name: Run hourly watcher and deliver sparse alerts
        if: ${{ ((github.event_name == 'schedule' && steps.market.outputs.open == 'true') || inputs.deliver) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m stockscout_unified.trend_birth_hourly \
            --update-state \
            --send \
            --delivery-endpoint "${{ vars.UNIFIED_DELIVERY_ENDPOINT }}"

      - name: Save hourly stage state
        if: ${{ success() && ((((github.event_name == 'schedule' || github.event_name == 'push') && steps.market.outputs.open == 'true') || inputs.deliver)) && vars.UNIFIED_DELIVERY_ENDPOINT != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state/trend-birth-hourly.json
          key: trend-birth-hourly-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Explain closed market
        if: ${{ github.event_name == 'schedule' && steps.market.outputs.open != 'true' }}
        run: echo "NYSE regular session is closed; Trend Birth evaluation skipped."

      - name: Explain disabled delivery
        if: ${{ ((github.event_name == 'schedule' && steps.market.outputs.open == 'true') || inputs.deliver) && vars.UNIFIED_DELIVERY_ENDPOINT == '' }}
        run: echo "Hourly Trend Birth alerts are paused because UNIFIED_DELIVERY_ENDPOINT is not configured."
