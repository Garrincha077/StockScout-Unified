[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockscout-unified"
version = "0.1.0"
description = "Three isolated EOD screeners in one deterministic mobile-first platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Luis Figo" }]
dependencies = [
  "curl-cffi>=0.7,<1.0",
  "duckdb>=1.1,<2.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2.3,<3.0",
  "pandas-market-calendars>=4.4,<6.0",
  "pyarrow>=18.0,<25.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-dotenv>=1.0,<2.0",
  "pyyaml>=6.0,<7.0",
  "requests>=2.32,<3.0",
  "rich>=13.9,<15.0",
  "structlog>=24.4,<26.0",
  "yfinance>=0.2.66,<0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
stockscout-eod = "stockscout_eod.cli:main"
stockscout-unified = "stockscout_unified.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "engines/next",
  "src/stock_scout",
  "tests/parity",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
